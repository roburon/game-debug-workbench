<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three-lane delivery · Debug demo</title>
  <link rel="stylesheet" href="debug-workbench.css">
  <link rel="stylesheet" href="workbench-board.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10171b; color: #edfbf7; font: 15px/1.55 system-ui, sans-serif; }
    main { margin: 0; padding: 24px; }
    .preview { width: min(100%, 350px); margin-inline: auto; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #52676b; border-radius: 18px; touch-action: none; }
    canvas:focus-visible, .lane-controls button:focus-visible { outline: 2px solid #99e8cd; outline-offset: 3px; }
    .lane-controls { display: flex; gap: 12px; margin-top: 10px; }
    .lane-controls button { flex: 1; min-height: 44px; color: #edfbf7; background: #244e3e; border: 1px solid #639d86; border-radius: 8px; font: inherit; cursor: pointer; }
    .preview p { margin: 8px 0 0; color: #b6c6cd; }
    .gdw-viewport:not(.gdw-viewport-fixed) .preview > canvas { max-height: max(100px, calc(100dvh - 280px)); object-fit: contain; }
    .gdw-viewport-fixed .preview { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; width: 100%; height: 100%; }
    .gdw-viewport-fixed canvas { height: 100%; width: 100%; object-fit: contain; background: #112820; }
    @media (max-width: 540px) { main { padding: 14px; } .preview { width: min(100%, 280px); } }
  </style>
</head>
<body class="gdw-demo">
  <main>
    <header class="gdw-demo-header" data-gdw-page-header>
      <h1>Game tuning and debugging</h1>
      <nav aria-label="Choose a demo">
        <a href="demo.html">Bouncing ball</a>
        <span aria-current="page">Three-lane delivery</span>
      </nav>
    </header>
    <div class="preview">
      <canvas width="320" height="440" tabindex="0" aria-label="Three-lane delivery. Use the left and right arrow keys to catch parcels."></canvas>
      <div class="lane-controls" aria-label="Delivery controls">
        <button type="button" data-move="-1">Left</button>
        <button type="button" data-move="1">Right</button>
      </div>
      <p data-play-hint>Use the arrow keys or buttons to move under the parcels</p>
    </div>
  </main>
  <script src="workbench-board.js"></script>
  <script src="workbench-replay.js"></script>
  <script src="debug-workbench.js"></script>
  <script src="lane-demo.js"></script>
</body>
</html>
