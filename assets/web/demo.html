<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game tuning and debugging</title>
  <link rel="stylesheet" href="debug-workbench.css">
  <link rel="stylesheet" href="workbench-board.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10171b; color: #edfbf7; font: 15px/1.55 system-ui, sans-serif; }
    main { margin: 0; padding: 24px; }
    .preview { width: min(100%, 350px); margin-inline: auto; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #52676b; border-radius: 18px; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #99e8cd; outline-offset: 3px; }
    .gdw-viewport-fixed .preview { display: grid; grid-template-rows: minmax(0, 1fr) auto; width: 100%; height: 100%; }
    .gdw-viewport-fixed canvas { height: 100%; width: 100%; object-fit: contain; background: #112820; }
    .preview p { margin: 8px 0 0; color: #b6c6cd; }
    .gdw-viewport:not(.gdw-viewport-fixed) .preview > canvas { max-height: max(100px, calc(100dvh - 210px)); object-fit: contain; }
    @media (max-width: 540px) { main { padding: 14px; } .preview { width: min(100%, 280px); } }
  </style>
</head>
<body class="gdw-demo">
  <main>
    <header class="gdw-demo-header" data-gdw-page-header>
      <h1>Game tuning and debugging</h1>
      <nav aria-label="Choose a demo">
        <span aria-current="page">Bouncing ball</span>
        <a href="lane-demo.html">Three-lane delivery</a>
      </nav>
    </header>
    <div class="preview">
      <canvas width="320" height="440" tabindex="0" aria-label="Bouncing ball preview"></canvas>
      <p data-play-hint>Tap or press Space to boost the ball</p>
    </div>
  </main>
  <script src="workbench-board.js"></script>
  <script src="workbench-replay.js"></script>
  <script src="debug-workbench.js"></script>
  <script src="demo.js"></script>
</body>
</html>
